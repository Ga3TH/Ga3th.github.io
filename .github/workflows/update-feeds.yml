name: Mettre à jour la veille IA

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Actualiser les flux RSS
        run: python3 scripts/update-feeds.py
      - name: Publier les nouveautés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualiser la veille IA"
            git push
          fi
